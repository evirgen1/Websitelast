params:
  env: production
  author: "Yusuf Evirgen"
  description: "Post-doctoral fellow at the Institute for Genocide and Mass Atrocity Prevention, Binghamton University. Research on state repression, human rights, coups, and contentious politics."

  # ── Home page ────────────────────────────────────────────────
  avatar: "profile.jpg"          # lives in assets/ or static/
  role: "Post-doctoral Fellow · **Institute for Genocide and Mass Atrocity Prevention**, Binghamton University"

  bio: |
    I am a post-doctoral fellow at [the Institute for Genocide and Mass Atrocity Prevention](https://www.binghamton.edu/i-gmap/index.html) at Binghamton University. I completed my Ph.D. in Political Science at Binghamton University in 2025. I received my B.A. in Political Science from Işık University in 2016.

    My research focuses on contentious politics, coups, human rights, and state repression. Broadly, I study when and how leaders employ state apparatuses to repress opposition in authoritarian countries, combining quantitative methodologies with in-depth interviews and fieldwork.

    My work has been published in the [Conflict Management and Peace Science](https://journals.sagepub.com/home/cmp). My work has been recognized with several awards, including Northeastern Political Science Association Best Paper Award in 2024.

  # ── Research interest chips (home page) ──────────────────────
  interests:
    substantive:
      - "State Repression"
      - "Human Rights"
      - "Coups"
      - "Contentious Politics"
      - "Political Violence"
    methods:
      - "Causal Inference"
      - "Text as Data"
      - "Large Language Models"
      - "Elite Interviews"
      - "Fieldwork"

  # ── Social icons. Leave a url blank to hide that icon. ───────
