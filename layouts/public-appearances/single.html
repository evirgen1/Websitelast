{{- define "main" }}

<p class="eyebrow"><a href="{{ "/public-appearances/" | relURL }}">&larr; Media</a></p>

<article>
  <header class="paper-header">
    <div class="appear-top" style="margin-bottom:10px">
      {{- with .Params.venue }}<span class="appear-venue">{{ . }}</span>{{ end }}
      <span class="appear-date">{{ .Date.Format "2 January 2006" }}</span>
    </div>

    <h1 class="paper-title">{{ .Title }}</h1>

    {{- with .Params.summary }}
    <p class="lede" style="margin-bottom:0">{{ . }}</p>
    {{- end }}

    {{- with .Params.links }}
    <div class="pub-links" style="margin-top:18px">
      {{- range . }}<a href="{{ .url }}" target="_blank" rel="noopener">{{ .name }}</a>{{ end }}
    </div>
    {{- end }}
  </header>

  <hr class="rule">

  <div class="prose">{{ .Content }}</div>
</article>

{{- end }}
