{{- define "main" }}

<article class="about-page">
  <header class="page-header">
    <h1 class="page-title">{{ .Title }}</h1>
    {{- if .Description }}
    <div class="page-description">{{ .Description }}</div>
    {{- end }}
  </header>
  
  <div class="about-content">
    {{ .Content }}
  </div>
</article>


{{- end }}{{/* end main */}}
